<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 5 - Sibling Quiz</title>

    <link rel="stylesheet" href="scene5.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div id="sparkleContainer"></div>
    <div id="rakhiContainer"></div>

    <div class="counter">🌼 0</div>

    <div class="topBtns">
        <button id="pauseBtn">▶</button>
        <button id="musicBtn">🎵</button>
    </div>

    <div class="container">

        <div class="tag">GAME TIME</div>

        <h1>The sibling quiz</h1>

        <p>There are no wrong answers here.</p>

        <div class="progress">
            <span class="active"></span>
            <span></span>
            <span></span>
        </div>

        <div class="quizCard">

            <h2 id="question">Who's more dramatic?</h2>

            <div class="options">
                <button id="leftBtn" class="option">Me 🫶</button>
                <button id="rightBtn" class="option">You 🫶</button>
            </div>

            <div id="response" class="response"></div>

        </div>

    </div>

    <div class="flowers">🌼 🌸 🌺 🌸 🌼 🌸 🌺 🌼</div>

    <audio id="player"></audio>

    <script src="scene5.js"></script>
</body>

</html>
