<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Raksha Bandhan</title>

  <link rel="stylesheet" href="style.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Cormorant+Garamond:wght@600;700&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Top Border -->
  <div class="top-border"></div>

  <!-- Floating Rakhi Background -->
  <div class="rakhi r1"></div>
  <div class="rakhi r2"></div>
  <div class="rakhi r3"></div>
  <div class="rakhi r4"></div>
  <div class="rakhi r5"></div>

  <!-- Sparkles -->
  <span class="spark s1">✦</span>
  <span class="spark s2">✧</span>
  <span class="spark s3">✦</span>
  <span class="spark s4">✧</span>
  <span class="spark s5">✦</span>

  <!-- Flowers -->
  <div class="flowers">
    🌼 🌺 🌼 🌸 🌼 🌸 🌼 🌺
  </div>

  <!-- Main Content -->
  <section class="container">

    <h1>
      Happy Raksha <br> Bandhan 🌼
    </h1>

    <div class="note">
      Someone spent way too much time making this for you. 🥺
    </div>

    <div class="polaroid">

      <div class="tape"></div>

      <span class="pin top">🌺</span>

      <div class="gift">🎁</div>

      <span class="pin bottom">🌼</span>

    </div>

    <h2>Wanna see what I made?</h2>

    <div class="buttons" id="buttonArea">

      <button id="yesBtn">Yes ❤️</button>

      <button id="noBtn">No 🥺</button>

    </div>

  </section>

  <script src="script.js"></script>

</body>

</html>
